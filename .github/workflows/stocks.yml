name: update-stocks
on:
  schedule:
    - cron: "*/30 3-11 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_stocks.py
      - run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stocks.json
          git diff --cached --quiet || (git commit -m "update stocks" && git pull --rebase origin main && git push)
