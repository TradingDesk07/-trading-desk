name: update-news
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch_news.py
      - run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json news.js feed.xml
          git diff --cached --quiet || (git commit -m "update news" && git pull --rebase origin main && git push)
