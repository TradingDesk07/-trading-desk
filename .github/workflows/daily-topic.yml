name: daily-topic
on:
  schedule:
    - cron: "30 13 * * *"   # roz 7:00 PM IST
  workflow_dispatch:
jobs:
  make:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      REQUIRE_VOICE: "1"        # awaaz na bane to video nahi banegi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install pillow edge-tts
      - run: python make_topic_short.py
      - uses: actions/upload-artifact@v4
        with:
          name: topic-short
          path: out/
      - name: Telegram par bhejo
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: |
          curl -s -F chat_id="$TELEGRAM_CHAT_ID" -F video=@out/topic-short.mp4 -F caption="Aaj ka concept. Sirf shiksha ke liye, investment salah nahi." "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo"
